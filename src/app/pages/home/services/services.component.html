<section id="services" class="mat-elevation-z4 services-section">
  <h2 class="section-title">Our Services</h2>

  <div class="service-grid">
    <mat-card class="service-card" *ngFor="let service of services">
      <mat-card-header>
        <mat-icon mat-card-avatar color="primary">{{ service.icon }}</mat-icon>
        <mat-card-title>{{ service.title }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ service.description }}</p>
        <ul>
          <li *ngFor="let point of service.points">
            <mat-icon class="bullet-icon">check_circle</mat-icon> {{ point }}
          </li>
        </ul>
      </mat-card-content>
    </mat-card>
  </div>
</section>
