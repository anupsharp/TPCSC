<!-- project.component.html -->
<section id="projects" class="mat-elevation-z4 projects-section">
    <h2 class="section-title">Our Project Ideas</h2>
    <mat-grid-list cols="4" rowHeight="150px" gutterSize="10px">
        <mat-grid-tile *ngFor="let image of images; let i = index" [colspan]="1" [rowspan]="1" class="tile"
            (click)="openImageDialog(image)">
            <img [src]="image" alt="Project {{ i + 1 }}" class="project-image" />
            <mat-grid-tile-footer>
                <h4 class="project-title">Project {{ i + 1 }}</h4>
            </mat-grid-tile-footer>
        </mat-grid-tile>
    </mat-grid-list>
</section>
